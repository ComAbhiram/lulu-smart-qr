<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Get the Lulu Money app</title>
  <script>
    (function () {
      var ua = navigator.userAgent || "";
      var ios = /iPhone|iPad|iPod/i.test(ua) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      var android = /Android/i.test(ua);
      var iosUrl = "https://apps.apple.com/ae/app/lulu-money-money-transfer-app/id1163514668";
      var androidUrl = "https://play.google.com/store/apps/details?id=com.lulu.luluone";
      var target = ios ? iosUrl : (android ? androidUrl : "");
      if (target) {
        window.location.replace(target);
      }
    })();
  </script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; min-height: 100vh;
      display: grid; place-items: center; background: #fff; color: #111; }
    main { text-align: center; padding: 28px; max-width: 420px; }
    a { display: block; margin: 14px 0; padding: 13px 18px; border: 1px solid #ddd;
      border-radius: 10px; color: #111; text-decoration: none; }
    p { color: #555; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <h1>Get the Lulu Money app</h1>
    <p>Choose your app store to continue.</p>
    <a href="https://apps.apple.com/ae/app/lulu-money-money-transfer-app/id1163514668">Download on the App Store</a>
    <a href="https://play.google.com/store/apps/details?id=com.lulu.luluone">Get it on Google Play</a>
  </main>
</body>
</html>
